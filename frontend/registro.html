<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar el meu negoci a Mitorex APP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="contenedor-estrecho">
  <header>
    <div>
      <h1>Registrar el meu negoci</h1>
      <p>Dona d'alta la teva empresa al directori de Mitorex</p>
    </div>
    <div class="nav-acciones">
      <a href="el-meu-negoci.html" class="btn-secundario">Àrea Empreses</a>
      <a href="index.html" class="btn-volver">← Tornar al directori</a>
    </div>
  </header>

  <main>
    <!-- Aviso dinámico según si el propietario tiene sesión iniciada -->
    <div id="aviso-cuenta" style="background: #ffffff; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
    </div>

    <div id="mensaje" class="alerta"></div>

    <form id="form-registro">
      <label>
        Nom de l'empresa *
        <input type="text" id="nombre" required minlength="2" maxlength="100" placeholder="Ex: Taller Mecànic Vallès" />
      </label>

      <label>
        Categoria *
        <select id="categoria" required>
          <option value="">Selecciona una categoria...</option>
          <option value="Hostaleria">Hostaleria</option>
          <option value="Restaurant">Restaurant</option>
          <option value="Pastisseria">Pastisseria</option>
          <option value="Comerç">Comerç i Botigues</option>
          <option value="Serveis">Serveis Professionals</option>
          <option value="Tecnologia">Tecnologia i Informàtica</option>
          <option value="Salut i Bellesa">Salut, Estètica i Benestar</option>
          <option value="Reformes i Llar">Reformes, Construcció i Llar</option>
          <option value="Automoció">Automoció i Tallers</option>
          <option value="Educació i Formació">Educació i Formació</option>
          <option value="Esport i Oci">Esport i Oci</option>
          <option value="Assessoria i Legal">Assessoria, Gestoria i Legal</option>
          <option value="Transport i Logística">Transport i Logística</option>
          <option value="Botiga d'animals">Botiga d'animals</option>
          <option value="Altres">Altres serveis</option>
        </select>
      </label>

      <label>
        Ubicació (Ciutat / Barri) *
        <input type="text" id="ubicacion" required placeholder="Ex: Terrassa, Centre" />
      </label>

      <label>
        Descripció dels serveis *
        <textarea id="descripcion" rows="3" required placeholder="Explica breument què ofereix la teva empresa..."></textarea>
      </label>

      <label>
        Telèfon de contacte
        <input type="text" id="telefono" placeholder="Ex: 600 123 456" />
      </label>

      <label>
        Correu electrònic
        <input type="email" id="correo" placeholder="Ex: contacte@empresa.cat" />
      </label>

      <label>
        Pàgina web
        <input type="text" id="web" placeholder="Ex: https://www.empresa.cat" />
      </label>

      <button type="submit">Enviar sol·licitud d'alta</button>
    </form>
  </main>

  <script>
    const API_URL = "https://mitorex-app.onrender.com";

    function obtenerUsuarioActual() {
      const raw = localStorage.getItem("mitorex_usuario");
      return raw ? JSON.parse(raw) : null;
    }

    function pintarBannerCuenta() {
      const banner = document.getElementById("aviso-cuenta");
      const usuario = obtenerUsuarioActual();

      if (usuario) {
        banner.style.borderLeft = "5px solid #16a34a";
        banner.innerHTML = `
          <div>
            <strong style="color: #183153;">✅ Sessió iniciada com a ${usuario.nombre}</strong>
            <div style="font-size: 13px; color: #526477;">El negoci quedarà vinculat al teu compte (${usuario.correo}) per poder editar-lo després.</div>
          </div>
          <a href="el-meu-negoci.html" class="btn-secundario" style="border: 1px solid #cbd5e1; font-size: 13px; padding: 8px 12px;">Veure els meus negocis</a>
        `;
      } else {
        banner.style.borderLeft = "5px solid #f59e0b";
        banner.innerHTML = `
          <div>
            <strong style="color: #183153;">⚠️ No has iniciat sessió</strong>
            <div style="font-size: 13px; color: #526477;">Si vols poder modificar les dades del teu negoci més endavant, crea un compte primer.</div>
          </div>
          <a href="el-meu-negoci.html" class="btn-primario" style="font-size: 13px; padding: 8px 14px;">Iniciar sessió / Registrar-me</a>
        `;
      }
    }

    document.getElementById("form-registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cajaMensaje = document.getElementById("mensaje");
      const usuario = obtenerUsuarioActual();

      const datos = {
        nombre: document.getElementById("nombre").value.trim(),
        categoria: document.getElementById("categoria").value,
        ubicacion: document.getElementById("ubicacion").value.trim(),
        descripcion: document.getElementById("descripcion").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        correo: document.getElementById("correo").value.trim(),
        web: document.getElementById("web").value.trim(),
        usuario_id: usuario ? usuario.id : null
      };

      try {
        const respuesta = await fetch(`${API_URL}/negocios`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        if (!respuesta.ok) throw new Error("No s'ha pogut registrar el negoci");

        const creado = await respuesta.json();
        cajaMensaje.innerHTML = `Sol·licitud enviada! <strong>"${creado.nombre}"</strong>  està pendent d'aprovació.` +
          (usuario ? ` <a href="el-meu-negoci.html" style="color: #166534; text-decoration: underline; margin-left: 6px;">Gestionar al meu espai →</a>` : "");
        cajaMensaje.className = "alerta exito";
        cajaMensaje.style.display = "block";
        e.target.reset();
      } catch (error) {
        console.error(error);
        cajaMensaje.textContent = "Error al connectar amb el servidor. Revisa que el backend estigui actiu.";
        cajaMensaje.className = "alerta error";
        cajaMensaje.style.display = "block";
      }
    });

    pintarBannerCuenta();
  </script>
</body>
</html>
